<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panadería</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body class="login-html">
    <div class="login-container">
        <h2 class="login-title">Iniciar Sesión</h2>
        <form id="login-form">
            <div class="form-login">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ingrese el usuario" required>
            </div>
            <div class="form-login">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>
       
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        // Sustituto de alert(): muestra un mensaje propio (sin la frase
        // "Esta página dice") como una tarjeta en la esquina superior derecha.
        function mostrarAviso(mensaje, tipo) {
            tipo = tipo || 'info';
            let contenedor = document.getElementById('avisoToastContenedor');
            if (!contenedor) {
                contenedor = document.createElement('div');
                contenedor.id = 'avisoToastContenedor';
                contenedor.className = 'aviso-toast-contenedor';
                document.body.appendChild(contenedor);
            }
            const iconos = { exito: '✓', error: '✕', info: 'i' };
            const toast = document.createElement('div');
            toast.className = 'aviso-toast aviso-' + tipo;
            toast.innerHTML = '<span class="aviso-toast-icono">' + (iconos[tipo] || 'i') + '</span><span class="aviso-toast-texto"></span>';
            toast.querySelector('.aviso-toast-texto').textContent = mensaje;
            contenedor.appendChild(toast);
            setTimeout(function() {
                toast.classList.add('aviso-saliendo');
                setTimeout(function() { toast.remove(); }, 280);
            }, 3200);
        }

        const form = document.getElementById('login-form');
        const usuario = document.getElementById('usuario');
        const password = document.getElementById('password');
 
        form.addEventListener('submit', function(event){
            event.preventDefault();
 
            const usuarioValue = usuario.value.trim();
            const passwordValue = password.value.trim();
 
            if(usuarioValue === 'admin' && passwordValue === '1234') {
                mostrarAviso('Inicio de sesión exitoso', 'exito');
                sessionStorage.setItem('adminLogueado', 'true');
                password.value = '';
                usuario.value = '';

                // Pequeña pausa para que el aviso alcance a verse antes de redirigir
                setTimeout(function() {
                    window.location.href = 'paneladmin.html';
                }, 900);

            }else{
                mostrarAviso('Usuario o contraseña incorrectos', 'error');
 
                password.value = '';
                usuario.value = '';
            }
 
        });
    </script>

</body>
</html>
